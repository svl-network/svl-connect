<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="svlTopGrad" x1="12" y1="2" x2="12" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00C980"/>
    </linearGradient>
    <linearGradient id="svlRightGrad" x1="12" y1="10" x2="21" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E232D"/>
      <stop offset="100%" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="svlLeftGrad" x1="3" y1="18" x2="12" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282E3B"/>
      <stop offset="100%" stop-color="#161920"/>
    </linearGradient>
    <linearGradient id="svlBoltGrad" x1="12" y1="6" x2="12" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00B36E"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Glow / Ambient Accent -->
  <rect x="2" y="2" width="20" height="20" rx="5" fill="#00E599" fill-opacity="0.08"/>

  <!-- Isometric Hex-Cube Base -->
  <!-- Top Facet -->
  <polygon points="12,3 20.5,7.5 12,12 3.5,7.5" fill="url(#svlTopGrad)"/>
  
  <!-- Right Side -->
  <polygon points="20.5,7.5 20.5,17 12,21.5 12,12" fill="url(#svlRightGrad)" stroke="#00E599" stroke-opacity="0.3" stroke-width="0.75"/>
  
  <!-- Left Side -->
  <polygon points="3.5,7.5 12,12 12,21.5 3.5,17" fill="url(#svlLeftGrad)" stroke="#00E599" stroke-opacity="0.3" stroke-width="0.75"/>

  <!-- Energy Core Crystal Bolt -->
  <polygon points="12.5,5 8.5,11.5 11.5,11.5 11,18 15.5,11 12.5,11" fill="url(#svlBoltGrad)"/>
</svg>
