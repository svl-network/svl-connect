<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Sunveil Connect</title>
  <defs>
    <linearGradient id="facetTop" x1="24" y1="4" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00C980"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="24" y1="24" x2="42" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B36E"/>
      <stop offset="100%" stop-color="#00663D"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="6" y1="35" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#008A54"/>
      <stop offset="100%" stop-color="#024528"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="16" y1="4" x2="32" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="24" y1="12" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#D6FFF0"/>
      <stop offset="100%" stop-color="#00E599"/>
    </linearGradient>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Faceted Sunveil Solar Prism -->
  <polygon points="24,5 41,14.8 24,24.5 7,14.8" fill="url(#facetTop)"/>
  <polygon points="41,14.8 41,34.2 24,44 24,24.5" fill="url(#facetRight)"/>
  <polygon points="7,14.8 24,24.5 24,44 7,34.2" fill="url(#facetLeft)"/>

  <!-- Golden Solar Crown Peak -->
  <polygon points="24,5 32.5,9.8 24,14.7 15.5,9.8" fill="url(#goldCrown)"/>

  <!-- Inner Dynamic Energy Bolt -->
  <polygon points="25.5,12 17.5,23.5 23.5,23.5 22.5,36 30.5,22.5 24.5,22.5" fill="url(#boltGrad)" filter="url(#boltGlow)"/>
</svg>
