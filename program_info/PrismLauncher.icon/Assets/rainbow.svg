<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Sunveil Connect Solar Base</title>
  <defs>
    <linearGradient id="facetTopRain" x1="24" y1="6" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00C980"/>
    </linearGradient>
    <linearGradient id="facetRightRain" x1="24" y1="24" x2="40" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B36E"/>
      <stop offset="100%" stop-color="#00663D"/>
    </linearGradient>
    <linearGradient id="facetLeftRain" x1="8" y1="34" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#008A54"/>
      <stop offset="100%" stop-color="#024528"/>
    </linearGradient>
    <linearGradient id="goldCrownRain" x1="16" y1="6" x2="32" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
  </defs>

  <!-- Top / North Facet -->
  <polygon points="24,7 39,15.5 24,24 9,15.5" fill="url(#facetTopRain)"/>
  
  <!-- Right / East Facet -->
  <polygon points="39,15.5 39,32.5 24,41 24,24" fill="url(#facetRightRain)"/>
  
  <!-- Left / West Facet -->
  <polygon points="9,15.5 24,24 24,41 9,32.5" fill="url(#facetLeftRain)"/>

  <!-- Golden Solar Crown Peak -->
  <polygon points="24,7 31.5,11.25 24,15.5 16.5,11.25" fill="url(#goldCrownRain)"/>
</svg>
