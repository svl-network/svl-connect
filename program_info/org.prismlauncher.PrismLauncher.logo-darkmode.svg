<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Sunveil Connect Logo (Dark Mode)</title>
  <defs>
    <linearGradient id="facetTopDark" x1="24" y1="6" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00C980"/>
    </linearGradient>
    <linearGradient id="facetRightDark" x1="24" y1="24" x2="40" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B36E"/>
      <stop offset="100%" stop-color="#00663D"/>
    </linearGradient>
    <linearGradient id="facetLeftDark" x1="8" y1="34" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#008A54"/>
      <stop offset="100%" stop-color="#024528"/>
    </linearGradient>
    <linearGradient id="goldCrownDark" x1="16" y1="6" x2="32" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="boltGradDark" x1="23" y1="13" x2="25" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#D6FFF0"/>
      <stop offset="100%" stop-color="#00E599"/>
    </linearGradient>
  </defs>

  <!-- Sunveil Emblem (Left) -->
  <g transform="translate(0, 0)">
    <!-- Top / North Facet -->
    <polygon points="24,7 39,15.5 24,24 9,15.5" fill="url(#facetTopDark)"/>
    <!-- Right / East Facet -->
    <polygon points="39,15.5 39,32.5 24,41 24,24" fill="url(#facetRightDark)"/>
    <!-- Left / West Facet -->
    <polygon points="9,15.5 24,24 24,41 9,32.5" fill="url(#facetLeftDark)"/>
    <!-- Golden Solar Crown Peak -->
    <polygon points="24,7 31.5,11.25 24,15.5 16.5,11.25" fill="url(#goldCrownDark)"/>
    <!-- Inner Dynamic Energy Bolt -->
    <polygon points="25.5,13 18.5,23.5 23.5,23.5 22.5,35 29.5,22.5 24.5,22.5" fill="url(#boltGradDark)"/>
  </g>

  <!-- Wordmark: SUNVEIL CONNECT -->
  <text x="50" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5" fill="#00E599">SUNVEIL</text>
  <text x="50" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="#FFFFFF">CONNECT</text>
</svg>
