<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Sunveil Connect</title>
  <defs>
    <linearGradient id="bgGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="10" y1="10" x2="246" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2C323D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E599" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="facetTop" x1="128" y1="36" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00C980"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="128" y1="128" x2="216" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B36E"/>
      <stop offset="100%" stop-color="#00663D"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="40" y1="184" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#008A54"/>
      <stop offset="100%" stop-color="#024528"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="84" y1="36" x2="172" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="124" y1="68" x2="132" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#D6FFF0"/>
      <stop offset="100%" stop-color="#00E599"/>
    </linearGradient>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Background Squircle -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>
  
  <!-- Faceted Sunveil Solar Prism -->
  <!-- Top / North Facet -->
  <polygon points="128,36 210,82 128,128 46,82" fill="url(#facetTop)"/>
  
  <!-- Right / East Facet -->
  <polygon points="210,82 210,174 128,220 128,128" fill="url(#facetRight)"/>
  
  <!-- Left / West Facet -->
  <polygon points="46,82 128,128 128,220 46,174" fill="url(#facetLeft)"/>

  <!-- Golden Solar Crown Peak -->
  <polygon points="128,36 169,59 128,82 87,59" fill="url(#goldCrown)"/>

  <!-- Inner Dynamic Energy Bolt -->
  <polygon points="136,68 98,126 125,126 120,188 158,120 131,120" fill="url(#boltGrad)" filter="url(#boltGlow)"/>
</svg>
