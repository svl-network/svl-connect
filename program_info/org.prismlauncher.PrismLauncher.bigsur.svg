<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Sunveil Connect macOS Icon</title>
  <defs>
    <linearGradient id="bgGrad" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="20" y1="20" x2="492" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2C323D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E599" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="facetTop" x1="256" y1="72" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00C980"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="256" y1="256" x2="432" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B36E"/>
      <stop offset="100%" stop-color="#00663D"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="80" y1="368" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#008A54"/>
      <stop offset="100%" stop-color="#024528"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="168" y1="72" x2="344" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="248" y1="136" x2="264" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#D6FFF0"/>
      <stop offset="100%" stop-color="#00E599"/>
    </linearGradient>
    <filter id="bigSurShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Background Squircle with macOS Big Sur corner radius & shadow -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#bigSurShadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>
  
  <!-- Faceted Sunveil Solar Prism -->
  <!-- Top / North Facet -->
  <polygon points="256,72 420,164 256,256 92,164" fill="url(#facetTop)"/>
  
  <!-- Right / East Facet -->
  <polygon points="420,164 420,348 256,440 256,256" fill="url(#facetRight)"/>
  
  <!-- Left / West Facet -->
  <polygon points="92,164 256,256 256,440 92,348" fill="url(#facetLeft)"/>

  <!-- Golden Solar Crown Peak -->
  <polygon points="256,72 338,118 256,164 174,118" fill="url(#goldCrown)"/>

  <!-- Inner Dynamic Energy Bolt -->
  <polygon points="272,136 196,252 250,252 240,376 316,240 262,240" fill="url(#boltGrad)" filter="url(#boltGlow)"/>
</svg>
